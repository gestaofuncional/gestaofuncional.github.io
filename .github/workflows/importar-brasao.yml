name: Importar brasão municipal
on:
  push:
    branches: [main]
    paths: ['.github/workflows/importar-brasao.yml']
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Baixar e validar imagem oficial
        run: |
          mkdir -p imagens
          curl --fail --silent --show-error --location --proto '=https' --max-time 45 --max-filesize 5000000 --output imagens/brasao.png 'https://www2.praiagrande.sp.gov.br/img/jpg/brasao_prefeitura.png'
          python - <<'PY'
          from pathlib import Path
          import struct
          data = Path('imagens/brasao.png').read_bytes()
          assert len(data) > 24 and data[:8] == b'\x89PNG\r\n\x1a\n' and data[12:16] == b'IHDR', 'Arquivo não é PNG'
          w,h = struct.unpack('>II', data[16:24])
          assert 1 <= w <= 5000 and 1 <= h <= 5000
          print(f'PNG válido: {w} x {h}')
          PY
      - name: Salvar somente o brasão
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- imagens/brasao.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Armazena brasão oficial localmente'
          git push origin HEAD:main

<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aprovação em massa | Gestão Funcional</title><link rel="stylesheet" href="layout.css"><link rel="stylesheet" href="modulos-gestao.css"></head><body class="sg-body"><div id="carregando" class="sg-carregando">Verificando sessão...</div><div id="app" hidden><header class="sg-cabecalho"><h1>Aprovação em massa</h1><p>Selecione solicitações previamente conferidas para aprovação conjunta.</p></header><section class="sg-card"><div class="mg-form"><label>Tipo<select id="lotTipo" class="sg-input"><option value="ferias">Férias</option><option value="abonada">Falta abonada</option><option value="justificativa">Justificativa</option></select></label><label>Pesquisar funcionário<input id="lotBusca" class="sg-input" placeholder="Nome ou RF"></label><label>Situação<select id="lotStatus" class="sg-input"><option value="">Pendentes e em análise</option><option value="pendente">Pendente</option><option value="em_analise">Em análise</option></select></label></div><div class="mg-actions"><button id="lotAtualizar" type="button" class="sg-btn sg-btn-secondary">Atualizar</button><label class="mg-check"><input type="checkbox" id="lotTodos">Selecionar itens desta página</label></div><p class="mg-muted">Confira os períodos e baixe os PDFs antes de aprovar. A seleção é limitada à página atual (até 50 itens).</p><p id="lotInfo" role="status" class="mg-muted"></p><div id="lotLista"></div><div class="mg-actions"><label class="mg-check"><input type="checkbox" id="lotConferido">Confirmei todos os documentos e períodos selecionados.</label></div><div class="mg-actions"><button id="lotAprovar" type="button" class="sg-btn sg-btn-success" disabled>Aprovar selecionados (0)</button><button id="lotAnterior" type="button" class="sg-btn sg-btn-secondary" disabled>Anterior</button><button id="lotProximo" type="button" class="sg-btn sg-btn-secondary" disabled>Próxima</button></div></section></div><script type="module" src="./aprovacao-lote.js"></script></body></html>
